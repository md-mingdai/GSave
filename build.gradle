plugins {
    id 'fabric-loom' version "${loom_version}"
}

def versionData = [
        '1.21'   : [yarn: '1.21+build.9', fabric: '0.102.0+1.21', malilib: '0.21.10',
                    modmenu: '11.0.5', mcRange: '>=1.21 <=1.21.1'],
        '1.21.3' : [yarn: '1.21.3+build.2', fabric: '0.114.1+1.21.3', malilib: '0.22.8',
                    modmenu: '12.0.1', mcRange: '>=1.21.2 <=1.21.3'],
        '1.21.4' : [yarn: '1.21.4+build.8', fabric: '0.119.4+1.21.4', malilib: '0.23.5',
                    modmenu: '13.0.4', mcRange: '1.21.4'],
        '1.21.5' : [yarn: '1.21.5+build.1', fabric: '0.128.2+1.21.5', malilib: '0.24.3',
                    modmenu: '14.0.2', mcRange: '1.21.5'],
        '1.21.8' : [yarn: '1.21.8+build.1', fabric: '0.136.1+1.21.8', malilib: '0.25.7',
                    modmenu: '15.0.2', mcRange: '>=1.21.6 <=1.21.8'],
        '1.21.10': [yarn: '1.21.10+build.3', fabric: '0.138.4+1.21.10', malilib: '0.26.8',
                    modmenu: '16.0.1', mcRange: '>=1.21.9 <=1.21.10'],
        '1.21.11': [yarn: '1.21.11+build.6', fabric: '0.141.6+1.21.11', malilib: '0.26.8',
                    malilibMc: '1.21.10', malilibMin: '0.27.20', modmenu: '17.0.1', mcRange: '1.21.11'],
]

def target = stonecutter.current.version
def data = versionData[target]

version = "${project.mod_version}+${target}"

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'SakuraRyoko'
        url = 'https://masa.dy.fi/maven/sakura-ryoko/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'FallenBreath'
        url = 'https://maven.fallenbreath.me/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${target}"
    mappings "net.fabricmc:yarn:${data.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${data.fabric}"
    modImplementation "fi.dy.masa.malilib:malilib-fabric-${data.malilibMc ?: target}:${data.malilib}"
    modCompileOnly "com.terraformersmc:modmenu:${data.modmenu}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range", data.mcRange
    inputs.property "malilib_min", data.malilibMin ?: data.malilib
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_range": data.mcRange,
                "malilib_min": data.malilibMin ?: data.malilib
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
