org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# 依赖下载遇到临时网络错误时多重试几次（Maven Central 偶发 429）
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=1000

# 构建工具（所有目标共用）
loader_version=0.20.1
loom_version=1.18.3

# 模组属性
mod_version=1.2.0
maven_group=com.mingdai
archives_base_name=gsave
