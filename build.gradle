plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def versionData = [
        '26.1.2': [fabric: '0.155.2+26.1.2', malilib: '0.28.12', modmenu: '18.0.2',
                   mcRange: '>=26.1 <=26.1.2'],
        '26.2'  : [fabric: '0.160.0+26.2', malilib: '0.29.6', modmenu: '20.0.3',
                   mcRange: '26.2'],
        '26.3'  : [fabric: '0.166.2+26.3', malilib: '0.30.2', modmenu: '21.0.0',
                   mcRange: '26.3'],
]

def target = stonecutter.current.version
def data = versionData[target]

version = "${project.mod_version}+${target}"

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'SakuraRyoko'
        url = 'https://masa.dy.fi/maven/sakura-ryoko/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'FallenBreath'
        url = 'https://maven.fallenbreath.me/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${target}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${data.fabric}"
    implementation "fi.dy.masa.malilib:malilib-fabric-${target}:${data.malilib}"
    compileOnly "com.terraformersmc:modmenu:${data.modmenu}"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.11.4'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_range", data.mcRange
    inputs.property "malilib_min", data.malilibMin ?: data.malilib
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_range": data.mcRange,
                "malilib_min": data.malilibMin ?: data.malilib
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
