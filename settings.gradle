pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'GSave'

stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'

    create(getRootProject()) {
        versions '1.21', '1.21.3', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11'
        vcsVersion = '1.21.8'
    }
}
