name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc:
          - '1.21'
          - '1.21.3'
          - '1.21.4'
          - '1.21.5'
          - '1.21.8'
          - '1.21.10'
          - '1.21.11'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Build for Minecraft ${{ matrix.mc }}
        run: gradle :${{ matrix.mc }}:build --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G

      - name: Upload mod jar for ${{ matrix.mc }}
        uses: actions/upload-artifact@v4
        with:
          name: gsave-jar-${{ matrix.mc }}
          path: |
            versions/${{ matrix.mc }}/build/libs/*.jar
            !versions/${{ matrix.mc }}/build/libs/*-sources.jar
          if-no-files-found: error
