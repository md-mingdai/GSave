name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mc:
          - '26.1.2'
          - '26.2'
          - '26.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Dump MaLiLib API (diagnostic)
        continue-on-error: true
        run: |
          gradle :${{ matrix.mc }}:compileJava --no-daemon || true
          JAR=$(find ~/.gradle/caches/modules-2/files-2.1/fi.dy.masa.malilib -name '*.jar' ! -name '*-sources.jar' 2>/dev/null | head -1)
          echo "MALILIB JAR: $JAR"
          if [ -n "$JAR" ]; then
            javap -classpath "$JAR" \
              fi.dy.masa.malilib.gui.GuiBase \
              fi.dy.masa.malilib.gui.GuiConfigsBase \
              fi.dy.masa.malilib.gui.widgets.WidgetBase \
              fi.dy.masa.malilib.gui.button.ButtonGeneric \
              fi.dy.masa.malilib.gui.GuiTextFieldGeneric \
              fi.dy.masa.malilib.util.InfoUtils \
              fi.dy.masa.malilib.render.RenderUtils \
              fi.dy.masa.malilib.interfaces.IRenderer 2>&1 | head -600
          fi
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G

      - name: Build for Minecraft ${{ matrix.mc }}
        run: gradle :${{ matrix.mc }}:build --stacktrace --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G

      - name: Upload mod jar for ${{ matrix.mc }}
        uses: actions/upload-artifact@v4
        with:
          name: gsave-jar-${{ matrix.mc }}
          path: |
            versions/${{ matrix.mc }}/build/libs/*.jar
            !versions/${{ matrix.mc }}/build/libs/*-sources.jar
          if-no-files-found: error
